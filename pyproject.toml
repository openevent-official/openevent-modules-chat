[build-system]
requires = ["setuptools>=65"]
build-backend = "setuptools.build_meta"

[project]
name = "openevent-modules-chat"
version = "0.1.0"
description = "OpenEvent chat.v1 protocol SDK"
requires-python = ">=3.10"
dependencies = [
    "openevent-sdk>=0.6.0",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
namespaces = true
