[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "openevent-modules-chat"
version = "0.1.0"
description = "OpenEvent chat.v1 protocol SDK"
requires-python = ">=3.10"
dependencies = [
    "openevent-sdk>=0.4.4",
]

[tool.hatch.build.targets.wheel]
packages = ["src/openevent"]

