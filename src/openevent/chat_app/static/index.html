<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>OpenEvent Chat</title>
  <link rel="stylesheet" href="/static/style.css">
  <script type="module" src="/static/app.js"></script>
</head>
<body>
  <section id="login" class="login-shell">
    <form id="login-form" class="login-card">
      <div class="brand-mark" aria-hidden="true">↗</div>
      <p class="eyebrow">OPENEVENT CHAT</p>
      <h1>Continue your conversation</h1>
      <p class="muted">Enter your access token to open your sessions.</p>
      <label for="token">Access token</label>
      <input id="token" name="token" type="password" autocomplete="current-password" required>
      <p id="login-error" class="error" role="alert"></p>
      <button type="submit" class="primary">Open chat <span aria-hidden="true">→</span></button>
    </form>
  </section>
  <div id="workspace" class="workspace" hidden>
    <aside class="sidebar">
      <div class="brand"><span class="brand-mark" aria-hidden="true">↗</span><span>OpenEvent <strong>Chat</strong></span></div>
      <button id="new-session" class="primary">＋ New session</button>
      <div class="sidebar-heading"><span>My sessions</span><button id="refresh-sessions" class="quiet" aria-label="Refresh sessions">Refresh</button></div>
      <p id="directory-error" class="error" role="alert"></p>
      <nav id="sessions" aria-label="Sessions"></nav>
      <div class="sidebar-footer"><span>Messages, files, and live replies</span><button id="logout" class="quiet">Sign out</button></div>
    </aside>
    <main class="conversation">
      <header class="conversation-header">
        <div class="conversation-heading">
          <p class="eyebrow">Your workspace</p>
          <div id="session-heading" class="session-heading">
            <h1 id="session-title">Select a session</h1>
            <button id="rename-session" type="button" class="quiet icon-button" aria-label="Rename session" title="Rename session" hidden>
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="m16 4 4 4-12 12H4v-4L16 4Z"/><path d="m14 6 4 4"/></svg>
            </button>
          </div>
          <form id="rename-form" class="rename-form" hidden>
            <label class="sr-only" for="session-name">Session name</label>
            <div class="rename-controls"><input id="session-name" name="name" type="text" autocomplete="off" required aria-describedby="rename-error"><button id="save-session-name" type="submit" class="quiet">Save</button><button id="cancel-rename" type="button" class="quiet">Cancel</button></div>
            <p id="rename-error" class="error" role="alert"></p>
          </form>
          <p id="session-channel" class="session-channel muted" hidden></p>
        </div>
        <span id="sync-status" class="sync-status" role="status"></span>
      </header>
      <div id="message-error" class="notice error" role="alert" hidden></div>
      <div id="messages" class="messages" role="log" aria-label="Chat history" aria-live="polite"></div>
      <div class="composer-area">
        <div id="submission-status" class="notice" role="status" hidden></div>
        <form id="composer" class="composer">
          <div id="reply-selection" class="reply-selection" aria-label="Selected replies"></div>
          <div id="draft-files" class="draft-files" aria-label="Files to send"></div>
          <label class="sr-only" for="message-input">Message</label>
          <textarea id="message-input" rows="3" placeholder="Write a message…"></textarea>
          <div class="composer-actions">
            <div><button id="choose-files" type="button" class="quiet">＋ Add files</button><input id="file-input" type="file" multiple hidden></div>
            <span class="keyboard-hint">Ctrl / ⌘ + Enter to send</span>
            <button id="send" class="send-button" type="submit" aria-label="Send message" title="Send message">
              <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M12 19V5m-6 6 6-6 6 6"/></svg>
            </button>
          </div>
        </form>
        <p class="composer-note">Sent messages appear in the conversation. Files are available to download.</p>
      </div>
    </main>
  </div>
</body>
</html>
