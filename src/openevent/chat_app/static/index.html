<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>OpenEvent Chat</title>
  <link rel="stylesheet" href="/static/style.css">
  <script type="module" src="/static/app.js"></script>
</head>
<body>
  <section id="login" class="login-shell">
    <form id="login-form" class="login-card">
      <div class="brand-mark" aria-hidden="true">↗</div>
      <p class="eyebrow">OPENEVENT CHAT</p>
      <h1>继续你的对话</h1>
      <p class="muted">输入访问口令，打开你的会话。</p>
      <label for="token">访问口令</label>
      <input id="token" name="token" type="password" autocomplete="current-password" required>
      <p id="login-error" class="error" role="alert"></p>
      <button type="submit" class="primary">进入会话 <span aria-hidden="true">→</span></button>
    </form>
  </section>
  <div id="workspace" class="workspace" hidden>
    <aside class="sidebar">
      <div class="brand"><span class="brand-mark" aria-hidden="true">↗</span><span>OpenEvent <strong>Chat</strong></span></div>
      <button id="new-session" class="primary">＋ 新建会话</button>
      <div class="sidebar-heading"><span>我的会话</span><button id="refresh-sessions" class="quiet" aria-label="刷新会话列表">刷新</button></div>
      <p id="directory-error" class="error" role="alert"></p>
      <nav id="sessions" aria-label="会话列表"></nav>
      <div class="sidebar-footer"><span>文字、文件与实时回复</span><button id="logout" class="quiet">移除访问口令</button></div>
    </aside>
    <main class="conversation">
      <header class="conversation-header"><div><p class="eyebrow">你的工作空间</p><h1 id="session-title">选择一个会话</h1></div><span id="sync-status" class="sync-status" role="status"></span></header>
      <div id="message-error" class="notice error" role="alert" hidden></div>
      <div id="messages" class="messages" role="log" aria-label="聊天记录" aria-live="polite"></div>
      <div class="composer-area">
        <div id="submission-status" class="notice" role="status" hidden></div>
        <form id="composer" class="composer">
          <div id="reply-selection" class="reply-selection" aria-label="选中的回复"></div>
          <div id="draft-files" class="draft-files" aria-label="待发送文件"></div>
          <label class="sr-only" for="message-input">消息</label>
          <textarea id="message-input" rows="3" placeholder="写下你的消息…"></textarea>
          <div class="composer-actions"><div><button id="choose-files" type="button" class="quiet">＋ 添加文件</button><input id="file-input" type="file" multiple hidden></div><span class="keyboard-hint">Ctrl / ⌘ + Enter 发送</span><button id="send" class="primary" type="submit">发送 <span aria-hidden="true">↑</span></button></div>
        </form>
        <p class="composer-note">消息发送后会显示在对话中。文件仅供下载。</p>
      </div>
    </main>
  </div>
</body>
</html>
